<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css" />
    <!-- <link rel="images" href="p"> -->
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
      <div class="choice" id="rock">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRc2HuD_RD_fQnKCP43G2cNB4J2P1fUkAT8Qg&s"
        />
      </div>
      <div class="choice" id="paper">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdcNjyxu3LO-GkStXP78Kd7LUhUB7n27NTzA&s"
        />
      </div>
      <div class="choice" id="scissors">
        <img
          src="https://play-lh.googleusercontent.com/Dm67Z-c0NCdZBJgs-5hb8hnEhFdvbv1JwSAytE5EEqsbRqe96kP4hSoVHEu13H1xPg"
        />
      </div>
    </div>

    <div class="score-board">
      <div class="score">
        <p id="user-score">0</p>
        <p>ME !!</p>
      </div>

      <p>&&</p>

      <div class="score">
        <p id="comp-score">0</p>
        <p>Computer</p>
      </div>
    </div>

    <div class="msg-container">
      <p id="msg">Play your move</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
